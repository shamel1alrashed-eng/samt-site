<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f2e8"><meta name="robots" content="noindex,nofollow,noarchive">
  <title>مقارنة الإضاءات الليلية | نزل الحمدانية | سمت</title>
  <meta name="description" content="قارن خيارات الإضاءة الليلية من الزاوية نفسها في نزل الحمدانية.">
  <link rel="canonical" href="https://samtstudio.com/view/alrashid-compare/">
  <link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="night.css?v=2">
  <script defer src="night.js?v=2"></script>
</head>
<body><main>
  <header><span>نزل الحمدانية</span><img src="/assets/logo-ink.svg" alt="سمت" width="102" height="42"></header>
  <h1>مقارنة الإضاءات الليلية</h1>
  <div class="mode-row">
    <p class="intro" id="instruction">اختر زاوية وإضاءتين، ثم اسحب الفاصل لتشاهد الفرق بينهما.</p>
    <label class="mode-switch"><input id="compare" type="checkbox" role="switch" checked aria-controls="second-field overlay"><span class="switch-track" aria-hidden="true"></span>تفعيل المقارنة</label>
  </div>
  <div class="fields" id="fields">
    <label>زاوية المشاهدة<select id="camera" disabled></select></label>
    <label><span id="first-title">الإضاءة الأولى</span><select id="first" disabled></select></label>
    <label id="second-field">الإضاءة الثانية<select id="second" disabled></select></label>
  </div>
  <figure aria-label="معاينة الإضاءة الليلية">
    <div class="stage" id="stage" aria-busy="true">
      <div id="photos"></div>
      <div id="overlay" hidden>
        <span class="badge right" id="rlabel"></span><span class="badge left" id="llabel"></span>
        <div class="line" aria-hidden="true"><span>‹ &nbsp; ›</span></div>
        <input id="split" type="range" min="0" max="100" value="50" dir="ltr" aria-label="موضع الفاصل بين الإضاءتين">
      </div>
    </div>
    <figcaption><span id="status" role="status" aria-live="polite">جارٍ تحميل المعاينة…</span></figcaption>
  </figure>
  <noscript>فعّل جافاسكربت لعرض الصور ومقارنة خيارات الإضاءة.</noscript>
</main></body></html>
